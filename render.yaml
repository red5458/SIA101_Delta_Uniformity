services:
  - type: web
    name: uniformity-api
    runtime: node
    plan: free
    rootDir: api
    # `--include=dev` keeps TypeScript/tsx available even though NODE_ENV is
    # production during the build; plain `npm ci` would skip them.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase session pooler URI (Project Settings -> Database).
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: auto
      - key: DATABASE_SSL_STRICT
        value: "false"
      - key: DATABASE_POOL_MAX
        value: "12"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Browser origin of the frontend service below. Update this if Render
      # assigns a different subdomain (or if you switch the frontend to Vercel).
      - key: WEB_ORIGIN
        value: https://uniformity-web.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: UPLOAD_DRIVER
        value: cloudinary
      # Gmail API OTP delivery. See docs/deployment.md for the OAuth steps.
      - key: EMAIL_MODE
        value: gmail
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: EXPOSE_DEV_OTP
        value: "false"

  # Next.js frontend. Server Components and the /api/* BFF both call the API
  # above over the public internet, so this is a plain Node web service.
  - type: web
    name: uniformity-web
    runtime: node
    plan: free
    rootDir: .
    # Must match the API service's URL, including the scheme. Render's
    # `fromService` only exposes the bare host, so it is written out here.
    # API_URL is read at build time (image rewrites) and at runtime (BFF),
    # so changing it requires a redeploy.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    # Static file, so the health check does not depend on the API being awake.
    healthCheckPath: /health.txt
    autoDeploy: true
    envVars:
      - key: API_URL
        value: https://uniformity-api.onrender.com
      # Optional: not read by the app today, kept for parity with the docs.
      - key: NEXT_PUBLIC_APP_URL
        value: https://uniformity-web.onrender.com
